
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI WORLD — Workspace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090711;
      color: white;
      padding: 30px 7%;
    }

    header {
      padding: 20px 0;
      border-bottom: 1px solid #ffffff22;
    }

    h1 {
      color: #c18cff;
    }

    main {
      text-align: center;
      padding: 60px 10px;
    }

    p {
      color: #aaa1b6;
      margin-top: 15px;
    }

    .profile-card {
      max-width: 420px;
      margin: 35px auto 0;
      padding: 25px;
      background: #171322;
      border: 1px solid #ffffff22;
      border-radius: 14px;
      text-align: left;
    }

    .profile-card h3 {
      color: #c18cff;
      margin-bottom: 22px;
      text-align: center;
    }

    .profile-row {
      padding: 13px 0;
      border-bottom: 1px solid #ffffff18;
    }

    .profile-row:last-child {
      border-bottom: none;
    }

    .profile-label {
      color: #aaa1b6;
      font-size: 13px;
    }

    .profile-value {
      color: white;
      margin-top: 7px;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    #profileMessage {
      text-align: center;
      color: #c18cff;
      margin-top: 20px;
    }

    
    button {
      margin-top: 30px;
      padding: 13px 25px;
      border: 0;
      border-radius: 9px;
      background: #a45be5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #editProfileForm {
      margin-top: 25px;
    }

    #editProfileForm input {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: 1px solid #ffffff33;
      border-radius: 8px;
      background: #090711;
      color: white;
      font-size: 15px;
    }

    #editMessage {
      text-align: center;
      margin-top: 15px;
      color: #c18cff;
    }
  #changePasswordForm {
  max-width: 420px;
  margin: 35px auto;
  padding: 25px;
  background: #171322;
  border: 1px solid #ffffff22;
  border-radius: 14px;
}

#changePasswordForm h3 {
  color: #c18cff;
  margin-bottom: 15px;
}

#changePasswordForm input {
  display: block;
  width: 100%;
  padding: 13px;
  margin-top: 15px;
  border: 1px solid #ffffff33;
  border-radius: 8px;
  background: #090711;
  color: white;
  font-size: 15px;
}

#passwordMessage {
  text-align: center;
  margin-top: 15px;
  color: #c18cff;
}
/* AI IMAGE GENERATOR */

.generator-card {
  max-width: 650px;
  margin: 50px auto;
  padding: 30px;
  background: #171322;
  border: 1px solid #ffffff22;
  border-radius: 16px;
  text-align: left;
}

.generator-card h2 {
  color: #c18cff;
  text-align: center;
  margin-bottom: 15px;
}

.generator-card p {
  text-align: center;
  margin-bottom: 25px;
}

.generator-card label {
  display: block;
  margin-top: 20px;
  color: #c18cff;
}

.generator-card textarea,
.generator-card select {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 1px solid #ffffff33;
  border-radius: 8px;
  background: #090711;
  color: white;
  font-size: 15px;
}

.generator-card textarea {
  min-height: 120px;
  resize: vertical;
}

.generator-card button {
  width: 100%;
  margin-top: 25px;
}

#generatorMessage {
  text-align: center;
  margin-top: 20px;
  color: #c18cff;
}
  </style>
</head>

<body>

<header>
  <h1>AI WORLD</h1>
</header>

<main>
  <h2>Welcome to Your Workspace</h2>
  <p>Your personal creative world starts here.</p>

  <section class="generator-card">
    <h2>AI Image Generator</h2>
    <p>Turn your imagination into reality.</p>

    <label for="imagePrompt">Describe your image</label>
    <textarea id="imagePrompt" placeholder="Describe the image you want to create..."></textarea>

    <label for="imageStyle">Choose Image Style</label>
    <select id="imageStyle">
      <option value="realistic">Realistic</option>
      <option value="cinematic">Cinematic</option>
      <option value="artistic">Artistic</option>
      <option value="anime">Anime</option>
      <option value="3d">3D</option>
    </select>

    <label for="imageSize">Choose Image Size</label>
    <select id="imageSize">
      <option value="square">Square</option>
      <option value="portrait">Portrait</option>
      <option value="landscape">Landscape</option>
    </select>

    <button id="generateImageButton">Generate Image</button>
    <div id="generatorMessage"></div>
  </section>

  <section class="profile-card">
    <h3>My Profile</h3>

    <div class="profile-row">
      <div class="profile-label">Full Name</div>
      <div class="profile-value" id="fullName">Loading...</div>
    </div>

    <div class="profile-row">
      <div class="profile-label">Username</div>
      <div class="profile-value" id="username">Loading...</div>
    </div>

    <div class="profile-row">
      <div class="profile-label">Public ID</div>
      <div class="profile-value" id="publicId">Loading...</div>
    </div>

    <div id="profileMessage"></div> <button id="editProfileButton">Edit Profile
    </button> <div id="editProfileForm" style="display: none;">
  <h3>Edit My Profile</h3>

  <input type="text" id="editFullName" placeholder="Full Name">

  <input type="text" id="editUsername" placeholder="Username">

  <button id="saveProfileButton">Save Changes</button>

  <div id="editMessage"></div>
</div>
  </section>

  <button id="logoutButton">Log Out</button>
  <div id="changePasswordForm">
  <h3>Change Password</h3>

  <input
    type="password"
    id="newPassword"
    placeholder="New Password"
  >

  <input
    type="password"
    id="confirmPassword"
    placeholder="Confirm New Password"
  >

  <button id="changePasswordButton">
    Update Password
  </button>

  <div id="passwordMessage"></div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://vmiwndsbffcarwrhvkww.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_d9sT4fQy95X-dIvfJwra2g_ERQ6Gzl1";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function checkUser() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error || !data.session) {
    window.location.href = "index.html";
    return; }
  await loadProfile(data.session.user.id);
}

  async function loadProfile(userId) {
    const { data: profile, error } = await supabaseClient
      .from("profiles")
      .select("full_name, username, public_id")
      .eq("user_id", userId)
      .maybeSingle();

    if (error) {
      document.getElementById("profileMessage").textContent =
       error.message;
      return;
    }

    if (!profile) {
      document.getElementById("profileMessage").textContent =
        "Profile information was not found.";
      return;
    }

    document.getElementById("fullName").textContent =
      profile.full_name || "Not provided";

    document.getElementById("username").textContent =
      profile.username || "Not provided";

    document.getElementById("publicId").textContent =
      profile.public_id ?? "Not assigned";
    document.getElementById("editFullName").value =
      profile.full_name || "";


document.getElementById("editUsername").value =
      profile.username || "";
  }

  
  checkUser();
  document.getElementById("generateImageButton").addEventListener("click", function() {
  const prompt = document.getElementById("imagePrompt").value.trim();
  const style = document.getElementById("imageStyle").value;
  const size = document.getElementById("imageSize").value;
  const message = document.getElementById("generatorMessage");

  if (!prompt) {
    message.textContent = "Please describe the image first.";
    return;
  }

  message.textContent =
    "Your image request is ready. AI generation will be connected soon.";
});
 document.getElementById("editProfileButton").addEventListener("click", function() {
  document.getElementById("editProfileForm").style.display = "block";
});
    document.getElementById("saveProfileButton").addEventListener("click", async function() {
  const fullName = document.getElementById("editFullName").value.trim();
  const username = document.getElementById("editUsername").value.trim();

  if (!fullName || !username) {
    document.getElementById("editMessage").textContent =
      "Please fill in both fields.";
    return;
  }

  const { data, error } = await supabaseClient.auth.getSession();

  if (error || !data.session) {
    document.getElementById("editMessage").textContent =
      "Session expired. Please log in again.";
    return;
  }

  const { data: updatedProfile, error: updateError } = await supabaseClient
    .from("profiles")
    .update({
      full_name: fullName,
      username: username
    })
    .eq("user_id", data.session.user.id)
    .select()
    .maybeSingle();
  if (updateError) {
    document.getElementById("editMessage").textContent =
      updateError.message;
    return;
  }
  if (!updatedProfile) {
    document.getElementById("editMessage").textContent =
      "Profile was not updated. Please try again.";
    return;
  }
  document.getElementById("fullName").textContent = fullName;
  document.getElementById("username").textContent = username;
  document.getElementById("editMessage").textContent =
    "Profile updated successfully!";
});
  document.getElementById("logoutButton").addEventListener("click", async function() {
    const { error } = await supabaseClient.auth.signOut();

    if (!error) {
      window.location.href = "index.html";
    }
  });
  document.getElementById("changePasswordButton").addEventListener("click", async function() {
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const message = document.getElementById("passwordMessage");

  if (newPassword.length < 6) {
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  if (newPassword !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({
    password: newPassword
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent = "Password updated successfully!";

  document.getElementById("newPassword").value = "";
  document.getElementById("confirmPassword").value = "";
});
</script>

</body>
</html>
